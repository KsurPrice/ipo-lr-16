{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4><i class="bi bi-box-arrow-in-right"></i> Вход</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3"><label>Логин</label><input type="text" name="username" class="form-control" required></div>
                        <div class="mb-3"><label>Пароль</label><input type="password" name="password" class="form-control" required></div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                    <div class="mt-3 text-center"><a href="{% url 'register' %}">Нет аккаунта? Зарегистрируйтесь</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
